[package]
name = "procmon-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows-only CI helper that wraps Sysinternals ProcMon around `trackly --self-test` and asserts no writes leak outside the portable sandbox."

[lints]
workspace = true

[[bin]]
name = "procmon-check"
path = "src/main.rs"

# Real ProcMon orchestration deps land in Plan 06. Target-gated to keep the
# crate cross-platform-buildable: on non-Windows hosts the dependency set is
# empty and `main.rs` short-circuits with a "Windows-only" message.
[target.'cfg(windows)'.dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = "1.3"
uuid = { version = "1", features = ["v4"] }
tempfile = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = "2"
sha2 = "0.10"

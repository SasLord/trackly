[package]
name = "procmon-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows-only CI helper that wraps Sysinternals ProcMon around `trackly --self-test` and asserts no writes leak outside the portable sandbox."

[lints]
workspace = true

[[bin]]
name = "procmon-check"
path = "src/main.rs"

# Real ProcMon orchestration deps land in Plan 06. Target-gated to keep the
# crate cross-platform-buildable: on non-Windows hosts the dependency set is
# empty and `main.rs` short-circuits with a "Windows-only" message.
[target.'cfg(windows)'.dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = "1.3"
uuid = { version = "1", features = ["v4"] }
tempfile = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# default-features disabled: the AES-crypto feature set pulls hmac/reset, which
# adds FixedOutputReset to Hmac → satisfies digest's DynDigest blanket impl →
# makes snmp2 0.5.0's `mac.update()` ambiguous (Mac vs DynDigest) and breaks its
# Windows build via workspace feature unification. ProcessMonitor.zip is plain
# deflate, so "deflate" alone is sufficient.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

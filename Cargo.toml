[workspace]
resolver = "2"
members = [
    "crates/trackly-core",
    "crates/trackly-infra",
    "crates/trackly-app",
    "tools/procmon-check",
]

[workspace.package]
edition = "2021"
rust-version = "1.92"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# All shared dependencies pinned here; member crates use `workspace = true`.
# Versions locked per Phase 1 CONTEXT.md (D-Workspace) and RESEARCH.md Standard Stack.
# Includes axum/tower/tower-http even though Phase 1 does not consume them yet —
# Plan 05 will use `workspace = true` against these so the HTTP topology is locked in Wave 0.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["macros", "time_0_3"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "net", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.38", features = ["bundled", "serde_json", "backup"] }
refinery = { version = "0.9", features = ["rusqlite-bundled"] }
toml = "0.8"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }
async-trait = "0.1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde", "serde_json"] }
tauri = { version = "2", features = ["devtools"] }
tauri-build = "2"
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript", "derive"] }
specta-typescript = "0.0.9"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "set-header", "fs"] }
argon2 = { version = "0.5", features = ["std"] }
tower-sessions = "0.15"
tokio-rustls = "0.26"
rcgen = "0.14"
rustls-pemfile = "2"
tower_governor = "0.8"
rmp-serde = "1"
sha2 = "0.10"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
chardetng = "0.1"
encoding_rs = "0.8"
csv = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

name: ci-fast

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fmt + clippy + test + ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      # Tauri 2 transitively pulls glib-sys / gtk-sys / webkit2gtk-sys, which
      # require these system C libraries at build time. ubuntu-latest does not
      # ship them by default. Per https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential curl wget file libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: pnpm install (frozen lockfile)
        working-directory: ui
        run: pnpm install --frozen-lockfile

      # NOTE: svelte-check is allowed to fail because ui/src/bindings.ts
      # references @tauri-apps/api/* which is not in ui/package.json yet
      # (deferred to Phase 2 — see .planning/phases/01-foundation/deferred-items.md).
      # When Phase 2 wires the Tauri runtime + adds @tauri-apps/api, remove
      # `continue-on-error: true` to make svelte-check a blocking gate again.
      # Mirrors the same shim already present in ci-full.yml.
      - name: pnpm svelte-check (non-blocking until Phase 2)
        id: svelte_check
        continue-on-error: true
        working-directory: ui
        run: pnpm svelte-check

      - name: pnpm lint
        working-directory: ui
        run: pnpm lint

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ci-fast"
            echo ""
            echo "ci-fast covers compile / lint / test on ubuntu-latest only (push to any branch)."
            echo "ci-full runs the full matrix (ubuntu / macos / windows) on PR + push to main,"
            echo "including the ProcMon portable-mode check on windows-latest."
          } >> "$GITHUB_STEP_SUMMARY"

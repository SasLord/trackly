name: ci-fast

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fmt + clippy + test + ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PRIV-01/PRIV-02 (WR-11): the repository is PUBLIC and anything committed stays
      # in git history even after deletion from HEAD, so the durable control is
      # keeping real organization requisites / employee ФИО / infrastructure
      # identifiers from entering at all. Runs immediately after Checkout — it is a
      # backstop, not a duplication of the local .githooks/pre-commit hook (that
      # hook is opt-in and always locally bypassable via --no-verify; this step is
      # the check that cannot be skipped), and a privacy violation should not wait
      # on a 20-minute build to be reported.
      - name: Privacy gate (organization requisites / ФИО / infra identifiers)
        run: node scripts/check-privacy.mjs --hashes scripts/privacy-tokens.sha256

      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      # Tauri 2 transitively pulls glib-sys / gtk-sys / webkit2gtk-sys, which
      # require these system C libraries at build time. ubuntu-latest does not
      # ship them by default. Per https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential curl wget file libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: pnpm install (frozen lockfile)
        working-directory: ui
        run: pnpm install --frozen-lockfile

      # rust-embed embeds the SPA via #[derive(RustEmbed)] #[folder = "../../ui/dist"]
      # and requires that folder to EXIST at compile time. ui/dist is gitignored, so
      # a fresh checkout has none. The `pnpm build` below regenerates it, but its
      # `prebuild` hook (cargo test --test export_bindings) compiles trackly-app
      # BEFORE vite writes ui/dist — circular. Seed a placeholder to break the cycle;
      # vite (emptyOutDir) then replaces it with the real SPA.
      - name: Seed ui/dist placeholder (breaks rust-embed prebuild cycle)
        shell: bash
        run: |
          mkdir -p ui/dist
          [ -f ui/dist/index.html ] || printf '<!doctype html><title>placeholder</title>\n' > ui/dist/index.html

      # Build the REAL Svelte SPA into ui/dist. Needed not just for compilation but
      # for tests/security_headers::server_serves_embedded_spa_index, which serves
      # GET / and asserts the real index.html mount point (a placeholder fails it).
      - name: Build Svelte SPA (ui/dist)
        working-directory: ui
        run: pnpm build

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # TRACKLY_AD_MOCK / TRACKLY_SNMP_MOCK: CI has no reachable AD/SNMP, so the
      # suite must run against the mock clients (D-Mock-01). Without these, AD-backed
      # tests (settings_ad, restore_request_visibility_http) get a real LDAP bind →
      # 503 SERVICE_UNAVAILABLE instead of the expected mock behavior.
      # --test-threads=1 serializes tests within each test binary. Several
      # tests build a tokio multi_thread runtime + tracing-appender non_blocking
      # background thread + WriterHandle spawn_blocking; running multiple such
      # tests in parallel saturates worker threads on the 4-CPU ubuntu runner
      # and deadlocks `build_health` / axum-oneshot tests (observed 30+ min
      # hang on first ci-full ubuntu run after merge; not reproducible locally
      # on macOS dev box). Cross-binary parallelism is still in effect; only
      # tests within the same binary are serialized.
      - name: cargo test
        env:
          TRACKLY_AD_MOCK: '1'
          TRACKLY_SNMP_MOCK: '1'
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

      # Phase 2 (Plan 02-02) resolved the @tauri-apps/api deferred item — svelte-check
      # is now a blocking gate. See .planning/phases/01-foundation/deferred-items.md.
      - name: pnpm svelte-check
        id: svelte_check
        working-directory: ui
        run: pnpm svelte-check

      - name: pnpm lint
        working-directory: ui
        run: pnpm lint

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ci-fast"
            echo ""
            echo "ci-fast covers compile / lint / test on ubuntu-latest only (push to any branch)."
            echo "ci-full runs the full matrix (ubuntu / macos / windows) on PR + push to main,"
            echo "including the ProcMon portable-mode check on windows-latest."
          } >> "$GITHUB_STEP_SUMMARY"

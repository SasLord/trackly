name: release-link

# Dry-run выпуска Trackly Link (Фаза 42, D-11). Публикации Release нет: установщик
# NSIS собирается и выкладывается как артефакт workflow на 7 дней. Публикацию и
# подпись добавляет Фаза 45.
# Изоляция от Trackly: свои теги (link-v*.*.*), свой workflow; release.yml не
# трогается. Условие держит scripts/check-release-isolation.mjs (ci-fast).

on:
  push:
    tags:
      - 'link-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия Link (например 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build:
    # Тег Trackly сюда не попадёт (фильтр выше); guard — страховка на случай правки триггеров.
    if: startsWith(github.ref_name, 'link-v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.92)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92'

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      # CDN GitHub отвечает 504 на единственную попытку бандлера — тулчейн NSIS кладём
      # заранее с повторами (как в release.yml). URL и SHA1 следуют версии
      # @tauri-apps/cli из pnpm-lock.yaml — обновлять вместе с ней.
      - name: Pre-fetch NSIS toolchain with retries
        shell: pwsh
        run: |
          $T = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force -Path $T | Out-Null
          function Fetch($url, $out, $sha1) {
            foreach ($attempt in 1..8) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -TimeoutSec 300
                $h = (Get-FileHash -Algorithm SHA1 $out).Hash
                if ($h -eq $sha1) { return }
                Write-Host "SHA1 mismatch for $url ($h), retrying"
              } catch { Write-Host "download of $url failed (attempt $attempt): $_" }
              Start-Sleep -Seconds 20
            }
            Write-Error "could not fetch $url"; exit 1
          }
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          Fetch 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' $zip 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D'
          Expand-Archive -Path $zip -DestinationPath $T -Force
          if (Test-Path "$T\NSIS") { Remove-Item -Recurse -Force "$T\NSIS" }
          Rename-Item "$T\nsis-3.11" 'NSIS'
          $add = "$T\NSIS\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $add | Out-Null
          Fetch 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' "$add\nsis_tauri_utils.dll" '75197FEE3C6A814FE035788D1C34EAD39349B860'
          Get-ChildItem "$T\NSIS" | Select-Object -First 10

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # D-10: версия Link правится ТОЛЬКО в crates/link-app (Cargo.toml и
      # tauri.conf.json); корневой Cargo.toml и release.yml не затрагиваются.
      # INPUT_VERSION передаётся через env, а не inline-выражением в run: GitHub
      # подставляет такие выражения в текст скрипта до запуска bash (CR-01).
      - name: Extract version and inject into link-app
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION:-0.1.0}"
          else
            VERSION="${GITHUB_REF_NAME#link-v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: недопустимая версия: $VERSION"; exit 1
          fi

          perl -0pi -e 's/^(version = ")[0-9]+\.[0-9]+\.[0-9]+(")/${1}'"${VERSION}"'${2}/m' crates/link-app/Cargo.toml
          jq --arg v "$VERSION" '.version = $v' \
            crates/link-app/tauri.conf.json > "$RUNNER_TEMP/_tauri.conf.json"
          mv "$RUNNER_TEMP/_tauri.conf.json" crates/link-app/tauri.conf.json

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          # Эхо точной строкой (не жёстким X.Y.Z: допустимы 0.1.0-test, 1.2.3-rc1).
          grep -Fq "version = \"${VERSION}\"" crates/link-app/Cargo.toml \
            || { echo "ERROR: Cargo.toml link-app: версия не ${VERSION}"; exit 1; }
          test "$(jq -r .version crates/link-app/tauri.conf.json)" = "${VERSION}" \
            || { echo "ERROR: tauri.conf.json link-app: версия не ${VERSION}"; exit 1; }

      # Сборка без heic и без vcpkg (D-01). Без tagName/releaseId: Release не создаётся.
      # CLI закреплён версией из lockfile (link-ui/node_modules), как в release.yml.
      - name: Build Link (NSIS)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/link-app
          args: --bundles nsis
          tauriScript: node ${{ github.workspace }}/link-ui/node_modules/@tauri-apps/cli/tauri.js

      - name: Summarize installer (name and sha256 only)
        shell: pwsh
        run: |
          $f = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $f) { Write-Error 'NSIS installer not found'; exit 1 }
          $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
          "### Trackly Link $env:VERSION (dry-run)`n`n$($f.Name)`nsha256: $h" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackly-link-${{ env.VERSION }}-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

name: ci-full

# Heavy matrix CI: fmt + clippy + test + UI + release build on Linux / macOS /
# Windows, plus the ProcMon portable-mode behavioral check on Windows.
# Runs on every PR and every push to main (per D-CI-01).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      # Tauri 2 transitively pulls glib-sys / gtk-sys / webkit2gtk-sys on Linux.
      # macOS + Windows runners have everything they need pre-installed.
      - name: Install Tauri 2 Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential curl wget file libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # See ci-fast.yml for rationale — --test-threads=1 prevents intra-binary
      # parallelism that deadlocks on tokio-multi_thread + spawn_blocking
      # contention on the 4-CPU ubuntu runner.
      - name: cargo test
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

      - name: cargo build --release -p trackly-app
        run: cargo build --release -p trackly-app

      - name: pnpm install (frozen lockfile)
        working-directory: ui
        run: pnpm install --frozen-lockfile

      # NOTE: svelte-check is allowed to fail because ui/src/bindings.ts
      # references @tauri-apps/api/* which is not in package.json yet
      # (deferred to Phase 2 — see .planning/phases/01-foundation/deferred-items.md).
      # When Phase 2 wires the Tauri runtime + adds @tauri-apps/api, remove
      # `continue-on-error: true` to make svelte-check a blocking gate again.
      - name: pnpm svelte-check (non-blocking until Phase 2)
        id: svelte_check
        continue-on-error: true
        working-directory: ui
        run: pnpm svelte-check

      - name: pnpm lint
        working-directory: ui
        run: pnpm lint

  procmon:
    name: procmon (windows-latest)
    needs: matrix
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Download Sysinternals ProcMon
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://download.sysinternals.com/files/ProcessMonitor.zip -OutFile pm.zip
          Expand-Archive pm.zip -DestinationPath C:\ProcMon
          Get-FileHash pm.zip -Algorithm SHA256 | Format-List
          echo "C:\ProcMon" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build trackly-app + procmon-check (release)
        run: |
          cargo build --release -p trackly-app
          cargo build --release -p procmon-check

      - name: Run portable-mode ProcMon check
        shell: pwsh
        run: cargo run --release -p procmon-check -- target/release/trackly.exe

      - name: Upload ProcMon trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: procmon-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/trackly_procmon_*/**/*.pml
            ${{ runner.temp }}/trackly_procmon_*/**/*.csv
          retention-days: 14
          if-no-files-found: ignore

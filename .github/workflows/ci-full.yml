name: ci-full

# Heavy matrix CI: fmt + clippy + test + UI + release build on Linux / macOS /
# Windows, plus the ProcMon portable-mode behavioral check on Windows.
# Runs on every PR and every push to main (per D-CI-01).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      # Tauri 2 transitively pulls glib-sys / gtk-sys / webkit2gtk-sys on Linux.
      # macOS + Windows runners have everything they need pre-installed.
      - name: Install Tauri 2 Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential curl wget file libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: pnpm install (frozen lockfile)
        working-directory: ui
        run: pnpm install --frozen-lockfile

      # rust-embed embeds the SPA via #[derive(RustEmbed)] #[folder = "../../ui/dist"]
      # and requires that folder to EXIST at compile time. ui/dist is gitignored, so
      # a fresh checkout has none. The `pnpm build` below regenerates it, but its
      # `prebuild` hook (cargo test --test export_bindings) compiles trackly-app
      # BEFORE vite writes ui/dist — circular. Seed a placeholder to break the cycle;
      # vite (emptyOutDir) then replaces it with the real SPA.
      - name: Seed ui/dist placeholder (breaks rust-embed prebuild cycle)
        shell: bash
        run: |
          mkdir -p ui/dist
          [ -f ui/dist/index.html ] || printf '<!doctype html><title>placeholder</title>\n' > ui/dist/index.html

      # Build the REAL Svelte SPA into ui/dist. Needed not just for compilation but
      # for tests/security_headers::server_serves_embedded_spa_index, which serves
      # GET / and asserts the real index.html mount point (a placeholder fails it).
      - name: Build Svelte SPA (ui/dist)
        working-directory: ui
        run: pnpm build

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # TRACKLY_AD_MOCK / TRACKLY_SNMP_MOCK: CI has no reachable AD/SNMP, so the
      # suite must run against the mock clients (D-Mock-01). Without these, AD-backed
      # tests (settings_ad, restore_request_visibility_http) get a real LDAP bind →
      # 503 SERVICE_UNAVAILABLE instead of the expected mock behavior.
      # --test-threads=1 prevents intra-binary parallelism that deadlocks on
      # tokio-multi_thread + spawn_blocking contention on the 4-CPU ubuntu runner.
      - name: cargo test
        env:
          TRACKLY_AD_MOCK: '1'
          TRACKLY_SNMP_MOCK: '1'
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

      - name: cargo build --release -p trackly-app
        run: cargo build --release -p trackly-app

      # svelte-check + lint are OS-independent static checks. They are skipped on
      # Windows because ui/src/bindings.ts (generated by the export_bindings test)
      # cannot be produced there — that test is #[cfg(not(windows))] due to a
      # specta-typescript STATUS_ENTRYPOINT_NOT_FOUND crash on the windows runner
      # (see .planning/phases/01-foundation/deferred-items.md). Ubuntu + macOS,
      # where bindings.ts IS generated by `pnpm build`, provide full coverage.
      # Phase 2 (Plan 02-02) resolved the @tauri-apps/api deferred item — svelte-check
      # is now a blocking gate.
      - name: pnpm svelte-check
        id: svelte_check
        if: runner.os != 'Windows'
        working-directory: ui
        run: pnpm svelte-check

      - name: pnpm lint
        if: runner.os != 'Windows'
        working-directory: ui
        run: pnpm lint

  procmon:
    name: procmon (windows-latest)
    needs: matrix
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Download Sysinternals ProcMon
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://download.sysinternals.com/files/ProcessMonitor.zip -OutFile pm.zip
          Expand-Archive pm.zip -DestinationPath C:\ProcMon
          Get-FileHash pm.zip -Algorithm SHA256 | Format-List
          echo "C:\ProcMon" | Out-File -FilePath $env:GITHUB_PATH -Append

      # rust-embed needs ui/dist to exist at compile time (see matrix job).
      - name: Seed ui/dist placeholder (breaks rust-embed prebuild cycle)
        shell: bash
        run: |
          mkdir -p ui/dist
          [ -f ui/dist/index.html ] || printf '<!doctype html><title>placeholder</title>\n' > ui/dist/index.html

      - name: Build trackly-app + procmon-check (release)
        run: |
          cargo build --release -p trackly-app
          cargo build --release -p procmon-check

      - name: Run portable-mode ProcMon check
        shell: pwsh
        run: cargo run --release -p procmon-check -- target/release/trackly.exe

      - name: Upload ProcMon trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: procmon-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/trackly_procmon_*/**/*.pml
            ${{ runner.temp }}/trackly_procmon_*/**/*.csv
          retention-days: 14
          if-no-files-found: ignore

# cargo-deny configuration for Trackly.
# Run via `cargo deny check` (CI: .github/workflows/cargo-deny.yml).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# RustSec advisory database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# License allow-list — extend cautiously and only after a manual audit of the new license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # webpki-roots ships the Mozilla CA root store — that payload is DATA, and
    # CDLA-Permissive-2.0 is a data license, not a code license. Scoped
    # exception rather than adding CDLA-Permissive-2.0 to `allow`, so the
    # exemption cannot silently spread to other crates. Reached transitively:
    # reqwest -> hyper-rustls -> webpki-roots.
    { allow = ["CDLA-Permissive-2.0"], name = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace `{ path = "../trackly-core" }` deps carry no version req, which
# cargo-deny counts as a wildcard. That is the normal shape for a path dependency
# inside one workspace and is not the supply-chain risk `wildcards = "deny"`
# exists to catch — registry deps are still held to the rule.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

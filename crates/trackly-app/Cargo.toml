[package]
name = "trackly-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never goes to crates.io — this is a workspace-internal crate. Also lets
# cargo-deny's `allow-wildcard-paths` apply: that setting is scoped to
# private crates, since crates.io forbids path deps in published ones.
publish = false
description = "Composition root for Trackly: Tauri 2 shell + axum HTTP (Phase 5) + AppCtx wiring."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "trackly"
path = "src/main.rs"

[dependencies]
trackly-core = { path = "../trackly-core" }
trackly-infra = { path = "../trackly-infra" }
tauri = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-process = "2"
toml = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
csv = { workspace = true }
uuid = { workspace = true }
tauri-plugin-dialog = { workspace = true }
rfd = { workspace = true }
# Phase 3.1 Plan 05 — G-8b: open temp PDF in system viewer / printing flow.
tauri-plugin-shell = { workspace = true }
# Phase 3.1 Plan 05 — G-8b: write PDF bytes via plugin-fs (Save / temp Open).
tauri-plugin-fs = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
krilla = "=0.7.0"
minijinja = { version = "^2.20", default-features = false, features = ["builtins", "json", "fuel", "serde", "multi_template"] }
regex = "1.12.3"
# G-9 (Phase 3.1 Plan 05): logo aspect-ratio — parse intrinsic dimensions
# without re-encoding image data. krilla still handles actual rendering.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Phase 15 Plan 01: exact glyph advance-width metrics for word-wrap
# (wrap_text_to_width) — promoted from an existing transitive dependency of
# krilla (via rustybuzz/skrifa); pinned to the already-resolved Cargo.lock
# version so `cargo build` does not need to re-resolve (Task 0 human-verify).
ttf-parser = "0.25.1"
# Phase 5: auth, server mode, TLS
argon2 = { workspace = true }
tower-sessions = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
# LAN-IP SAN detection for self-signed certs when bind host is wildcard (0.0.0.0/::).
if-addrs = { workspace = true }
hostname = { workspace = true }
tower_governor = { workspace = true }
rmp-serde = { workspace = true }
sha2 = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
async-trait = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Server-mode SPA delivery: embed ui/dist into the binary (release) / read from
# disk (debug) so the LAN axum server can serve the Svelte SPA in a portable
# build without shipping loose files next to the executable.
rust-embed = { version = "8", features = ["mime-guess"] }
# Phase 16: base64 data: URI encoding for logo embedding in HTML act templates.
# Already resolved transitively at 0.22.1 (axum/krilla/rcgen/tauri) — pinned as
# a direct dep explicitly, adding zero new supply-chain surface.
base64 = "0.22"

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
specta-typescript = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
tracing-appender = { workspace = true }
pdf-extract = "^0.10"
# WebSocket client for the upgrade-plumbing regression test (Bug A:
# serve_connection without .with_upgrades() dropped the socket post-101).
# Pinned to the version already in Cargo.lock (pulled transitively by the
# Tauri/wry stack) to avoid a new resolver entry.
tokio-tungstenite = "0.29"
futures-util = "0.3"

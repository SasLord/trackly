[package]
name = "trackly-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Composition root for Trackly: Tauri 2 shell + axum HTTP (Phase 5) + AppCtx wiring."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "trackly"
path = "src/main.rs"

[dependencies]
trackly-core = { path = "../trackly-core" }
trackly-infra = { path = "../trackly-infra" }
tauri = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
csv = { workspace = true }
uuid = { workspace = true }
tauri-plugin-dialog = { workspace = true }
# Phase 3.1 Plan 05 — G-8b: open temp PDF in system viewer / printing flow.
tauri-plugin-shell = { workspace = true }
# Phase 3.1 Plan 05 — G-8b: write PDF bytes via plugin-fs (Save / temp Open).
tauri-plugin-fs = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
krilla = "=0.7.0"
minijinja = { version = "^2.20", default-features = false, features = ["builtins", "json", "fuel", "serde"] }
regex = "1.12.3"
# G-9 (Phase 3.1 Plan 05): logo aspect-ratio — parse intrinsic dimensions
# without re-encoding image data. krilla still handles actual rendering.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
specta-typescript = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
sha2 = "0.10"
tracing-appender = { workspace = true }
pdf-extract = "^0.10"

[package]
name = "trackly-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never goes to crates.io — this is a workspace-internal crate. Also lets
# cargo-deny's `allow-wildcard-paths` apply: that setting is scoped to
# private crates, since crates.io forbids path deps in published ones.
publish = false
# Цели интеграционных тестов перечислены в [[test]] ниже (suite-бинарники).
autotests = false
description = "Composition root for Trackly: Tauri 2 shell + axum HTTP (Phase 5) + AppCtx wiring."

[lints]
workspace = true

[features]
heic = ["dep:libheif-rs"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "trackly"
path = "src/main.rs"

[dependencies]
trackly-core = { path = "../trackly-core" }
trackly-infra = { path = "../trackly-infra" }
tauri = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-process = "2"
toml = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
csv = { workspace = true }
uuid = { workspace = true }
tauri-plugin-dialog = { workspace = true }
rfd = { workspace = true }
# Phase 3.1 Plan 05 — G-8b: open temp PDF in system viewer / printing flow.
tauri-plugin-shell = { workspace = true }
tauri-plugin-notification = { workspace = true }
# Phase 3.1 Plan 05 — G-8b: write PDF bytes via plugin-fs (Save / temp Open).
tauri-plugin-fs = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
krilla = "=0.7.0"
minijinja = { version = "^2.20", default-features = false, features = ["builtins", "json", "fuel", "serde", "multi_template"] }
regex = "1.12.3"
# G-9 (Phase 3.1 Plan 05): logo aspect-ratio — parse intrinsic dimensions
# without re-encoding image data. krilla still handles actual rendering.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
infer = { workspace = true }
percent-encoding = { workspace = true }
tempfile = { workspace = true }
# HEIC->JPEG (D-10/D-24): Windows-only build switch, NOT in default features.
libheif-rs = { version = "3.0", default-features = false, features = ["v1_17"], optional = true }
# Phase 15 Plan 01: exact glyph advance-width metrics for word-wrap
# (wrap_text_to_width) — promoted from an existing transitive dependency of
# krilla (via rustybuzz/skrifa); pinned to the already-resolved Cargo.lock
# version so `cargo build` does not need to re-resolve (Task 0 human-verify).
ttf-parser = "0.25.1"
# Phase 5: auth, server mode, TLS
argon2 = { workspace = true }
tower-sessions = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
# LAN-IP SAN detection for self-signed certs when bind host is wildcard (0.0.0.0/::).
if-addrs = { workspace = true }
hostname = { workspace = true }
tower_governor = { workspace = true }
rmp-serde = { workspace = true }
sha2 = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
async-trait = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Server-mode SPA delivery: embed ui/dist into the binary (release) / read from
# disk (debug) so the LAN axum server can serve the Svelte SPA in a portable
# build without shipping loose files next to the executable.
rust-embed = { version = "8", features = ["mime-guess"] }
# Phase 16: base64 data: URI encoding for logo embedding in HTML act templates.
# Already resolved transitively at 0.22.1 (axum/krilla/rcgen/tauri) — pinned as
# a direct dep explicitly, adding zero new supply-chain surface.
base64 = "0.22"

# Phase 41.5 gap R2-1: notify_desktop with on_activated (Windows only).
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = { workspace = true }
# Phase 41.5 gap R3-1: Setting() probe before showing a toast (read-only).
windows = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
# Builds OLE2 compound files for the DOC/XLS sniffing fixtures (already in the lock via infer).
cfb = "0.14"
specta-typescript = { workspace = true }
anyhow = { workspace = true }
tracing-appender = { workspace = true }
pdf-extract = "^0.10"
# WebSocket client for the upgrade-plumbing regression test (Bug A:
# serve_connection without .with_upgrades() dropped the socket post-101).
# Pinned to the version already in Cargo.lock (pulled transitively by the
# Tauri/wry stack) to avoid a new resolver entry.
tokio-tungstenite = "0.29"
futures-util = "0.3"

# Интеграционные тесты собраны в несколько бинарников (suite) вместо одного
# бинарника на файл: каждый бинарник линкует весь крейт, и ~200 линковок плюс
# проверка каждого свежего бинарника в macOS съедали часы локального прогона.
# Файлы тестов остаются на своих местах в `tests/` (их читают гейты по путям),
# корень suite подключает их через `#[path]`. Новый файл `tests/*.rs` нужно
# добавить строкой в один из `tests/suites/*.rs` — иначе краснеет гейт
# `suite_wiring` (trackly-app). Отдельными целями остаются файлы, которым
# нужен свой процесс (меняют env/глобальный subscriber) или чьё имя цели
# вызывают по `--test` (`export_bindings`, `attachments_heic`).

[[test]]
name = "app_acts"
path = "tests/suites/acts.rs"

[[test]]
name = "app_attachments"
path = "tests/suites/attachments.rs"

[[test]]
name = "app_auth"
path = "tests/suites/auth.rs"

[[test]]
name = "app_cartridges"
path = "tests/suites/cartridges.rs"

[[test]]
name = "app_chat"
path = "tests/suites/chat.rs"

[[test]]
name = "app_devices"
path = "tests/suites/devices.rs"

[[test]]
name = "app_gates"
path = "tests/suites/gates.rs"

[[test]]
name = "app_groups"
path = "tests/suites/groups.rs"

[[test]]
name = "app_places"
path = "tests/suites/places.rs"

[[test]]
name = "app_repairs"
path = "tests/suites/repairs.rs"

[[test]]
name = "app_reports"
path = "tests/suites/reports.rs"

[[test]]
name = "app_server"
path = "tests/suites/server.rs"

[[test]]
name = "attachments_heic"
path = "tests/attachments_heic.rs"

[[test]]
name = "export_bindings"
path = "tests/export_bindings.rs"

[[test]]
name = "health_smoke"
path = "tests/health_smoke.rs"

[[test]]
name = "phase06_stubs"
path = "tests/phase06_stubs.rs"

[[test]]
name = "template_edit"
path = "tests/template_edit.rs"

[[test]]
name = "templates_status"
path = "tests/templates_status.rs"

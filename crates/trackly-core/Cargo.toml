[package]
name = "trackly-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure domain layer for Trackly. No I/O. No tokio. No rusqlite. No tauri."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# trackly-core is pure-domain. The following crates are FORBIDDEN here and the
# `tests/no_io_deps.rs` integration test enforces this at every CI run:
#   tokio, rusqlite, tauri, axum, hyper, tower, reqwest, sqlx, libsqlite3-sys
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
async-trait = { workspace = true }
# Plan 05: specta::Type для AppError (через manual impl в src/error.rs).
# Specta — pure-data crate (no tokio/rusqlite/tauri/axum), не нарушает FOUND-01.
specta = { workspace = true }

[dev-dependencies]
static_assertions = "1"

[package]
name = "trackly-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never goes to crates.io — this is a workspace-internal crate. Also lets
# cargo-deny's `allow-wildcard-paths` apply: that setting is scoped to
# private crates, since crates.io forbids path deps in published ones.
publish = false
# Цели интеграционных тестов перечислены в [[test]] ниже (suite-бинарник).
autotests = false
description = "Adapters and I/O for Trackly: SQLite repos, refinery migrations, paths.rs, single-writer worker."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
trackly-core = { path = "../trackly-core" }
rusqlite = { workspace = true }
refinery = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
async-trait = { workspace = true }
snmp2 = { workspace = true }
tempfile = { workspace = true }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
hickory-resolver = "0.26.1"
# Spike 001 (AD SSO / Kerberos-SPNEGO server-side accept). `default-features = false`
# drops the `aws-lc-rs` C-crypto TLS provider (only needed for the unused
# `network_client`/rustls path) to keep the portable Windows build free of a
# mandatory native crypto toolchain dependency — CI proves whether this holds.
sspi = { version = "0.21", default-features = false }

# Интеграционные тесты собраны в несколько бинарников (suite) вместо одного
# бинарника на файл: каждый бинарник линкует весь крейт, и ~200 линковок плюс
# проверка каждого свежего бинарника в macOS съедали часы локального прогона.
# Файлы тестов остаются на своих местах в `tests/` (их читают гейты по путям),
# корень suite подключает их через `#[path]`. Новый файл `tests/*.rs` нужно
# добавить строкой в один из `tests/suites/*.rs` — иначе краснеет гейт
# `suite_wiring` (trackly-app). Отдельными целями остаются файлы, которым
# нужен свой процесс (меняют env/глобальный subscriber) или чьё имя цели
# вызывают по `--test` (`export_bindings`, `attachments_heic`).

[[test]]
name = "infra_tests"
path = "tests/suites/infra.rs"
